<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Sandler Rules Quiz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&display=swap">
<style>
:root{
  --ground:#F2F4F7; --surface:#FFFFFF; --ink:#1A2129; --muted:#5B6672; --line:#D8DEE5;
  --accent:#C8102E; --accent-ink:#FFFFFF; --accent-soft:#FBE9EC; --accent-line:#E9A3AE;
  --ok:#1E7F4F; --ok-soft:#E3F3EA; --bad:#B42318; --bad-soft:#FCE8E6;
  --shadow:0 1px 2px rgba(26,33,41,.06),0 8px 24px -12px rgba(26,33,41,.18);
  --radius:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --ground:#12161B; --surface:#1B2129; --ink:#E8ECF0; --muted:#98A4B0; --line:#2C343D;
  --accent:#FF5C6C; --accent-ink:#1A0A0D; --accent-soft:#3A1C22; --accent-line:#7A2E38;
  --ok:#5BD08F; --ok-soft:#173225; --bad:#FF8A7A; --bad-soft:#3B1F1B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --ground:#12161B; --surface:#1B2129; --ink:#E8ECF0; --muted:#98A4B0; --line:#2C343D;
  --accent:#FF5C6C; --accent-ink:#1A0A0D; --accent-soft:#3A1C22; --accent-line:#7A2E38;
  --ok:#5BD08F; --ok-soft:#173225; --bad:#FF8A7A; --bad-soft:#3B1F1B;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.5;padding-block:0 48px;padding-inline:16px}
h1,h2,h3{font-family:"Bricolage Grotesque","Source Sans 3",system-ui,sans-serif;text-wrap:balance;margin:0;line-height:1.1}
button{font:inherit;cursor:pointer}
a{color:var(--accent)}
.wrap{max-width:720px;margin:0 auto}
.bar{position:sticky;top:0;z-index:5;background:var(--ground);padding-block:12px 8px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:16px}
.bar-in{max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:14px;color:var(--muted)}
.bar-in strong{color:var(--ink);font-weight:600}
.track{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden;max-width:720px;margin-inline:auto}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.pill{font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:28px;margin-top:24px}
.eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700}
.rulenum{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:64px;line-height:1;color:var(--accent);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.ruletitle{font-size:26px;font-weight:700;margin-top:6px}
.q{margin-top:28px;padding-top:22px;border-top:1px solid var(--line)}
.q h3{font-size:19px;font-weight:700;font-family:"Source Sans 3",sans-serif;line-height:1.35}
.q h3 span{color:var(--muted);font-weight:600;margin-right:8px;font-variant-numeric:tabular-nums}
.opts{display:grid;gap:8px;margin-top:12px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;transition:border-color .15s,background .15s}
.opt:hover{border-color:var(--muted)}
.opt input{margin:4px 0 0;accent-color:var(--accent);flex:none;width:18px;height:18px}
.opt .l{font-weight:700;color:var(--muted);flex:none;width:20px}
.opt:focus-within{outline:2px solid var(--accent);outline-offset:2px}
.q.done .opt{cursor:default;opacity:.75}
.q.done .opt:hover{border-color:var(--line)}
.q.done .opt.correct{opacity:1;border-color:var(--ok);background:var(--ok-soft)}
.q.done .opt.correct .l{color:var(--ok)}
.q.done .opt.picked{opacity:1;border-color:var(--bad);background:var(--bad-soft)}
.q.done .opt.picked .l{color:var(--bad)}
.fb{margin-top:12px;padding:12px 14px;border-radius:8px;font-size:15px;line-height:1.45}
.fb.ok{background:var(--ok-soft);color:var(--ink);border-left:3px solid var(--ok)}
.fb.bad{background:var(--bad-soft);color:var(--ink);border-left:3px solid var(--bad)}
.fb b{font-weight:700}
.tp{margin-top:28px;padding:18px 20px;border-radius:var(--radius);border:1px solid var(--accent-line);background:var(--accent-soft)}
.tp p{margin:6px 0 0}
.nav{display:flex;justify-content:space-between;gap:12px;margin-top:28px;flex-wrap:wrap}
.btn{padding:12px 20px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.hint{font-size:14px;color:var(--muted);margin-top:10px}
.hero h1{font-size:44px;font-weight:800;letter-spacing:-.02em}
.hero p{max-width:60ch}
.field{margin-top:20px}
.field label{display:block;font-weight:600;margin-bottom:6px}
.field input{width:100%;font:inherit;padding:12px 14px;border:1px solid var(--line);border-radius:8px;background:var(--ground);color:var(--ink)}
.field input:focus{outline:2px solid var(--accent);outline-offset:1px}
.steps{display:grid;gap:10px;margin:22px 0 0;padding:0;list-style:none;counter-reset:s}
.steps li{display:flex;gap:14px;align-items:flex-start;counter-increment:s}
.steps li::before{content:counter(s);flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:800;display:grid;place-items:center;font-size:14px;font-family:"Bricolage Grotesque",sans-serif}
.saved{margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.saved h3{font-size:15px;font-family:"Source Sans 3",sans-serif;color:var(--muted)}
.saved .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.saved button{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px}
.saved button small{color:var(--muted);font-weight:400;margin-left:6px;font-variant-numeric:tabular-nums}
.jump{margin-top:18px}
.jump summary{cursor:pointer;color:var(--muted);font-size:14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:12px}
.grid button{aspect-ratio:1;border-radius:6px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;font-variant-numeric:tabular-nums;color:var(--muted)}
.grid button.done{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.grid button.part{background:var(--accent-soft);border-color:var(--accent-line);color:var(--ink)}
.grid button.cur{outline:2px solid var(--accent);outline-offset:1px}
.score{display:flex;gap:28px;align-items:baseline;flex-wrap:wrap;margin-top:8px}
.score .big{font-family:"Bricolage Grotesque",sans-serif;font-size:72px;font-weight:800;line-height:1;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.score .sub{color:var(--muted);font-size:16px}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px;margin-top:16px}
.rgrid div{aspect-ratio:1;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;border:1px solid var(--line);cursor:pointer}
.rgrid .s3{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.rgrid .s2{background:var(--accent-soft);color:var(--ink);border-color:var(--accent-line)}
.rgrid .s1,.rgrid .s0{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.legend{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.send{margin-top:26px;padding:20px;border-radius:var(--radius);background:var(--accent-soft);border:1px solid var(--accent-line)}
.send h3{font-size:18px;font-family:"Source Sans 3",sans-serif}
.send .row{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
textarea{width:100%;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);margin-top:12px;min-height:160px}
.toast{font-size:14px;margin-top:8px;color:var(--ok);font-weight:600;min-height:20px}
[hidden]{display:none!important}
@media (max-width:480px){.card{padding:20px}.hero h1{font-size:34px}.rulenum{font-size:52px}.score .big{font-size:56px}}
@media (prefers-reduced-motion:reduce){.track i{transition:none}}
</style>
</head>
<body>
<div class="bar" id="bar" hidden>
  <div class="bar-in"><span><strong id="barRule"></strong> <span id="barName"></span></span><span class="pill" id="barCount"></span></div>
  <div class="track"><i id="barFill"></i></div>
</div>
<div class="wrap" id="app"></div>
<script>
const RULES = [{"n": 1, "id": "tkP5nrzvuQQ", "t": "You Have to Learn to Fail, to Win", "d": 112, "q": [{"q": "Why does Dave say failure is unavoidable in sales?", "o": ["Because in sales you lose more than you win; nobody closes 10 for 10", "Because managers set quotas too high", "Because prospects are unpredictable and rarely honest", "Because most salespeople are poorly trained"], "a": 0, "e": "Dave's point is that sales is a losing game by the numbers. Nobody closes every deal, and winning 30 percent can make you a hero, so failure is built in."}, {"q": "What does Dave say to do right after losing a big deal?", "o": ["Ask what you learned and create a lesson from it", "Lower your price on the next deal to make up for it", "Ask the prospect for a second chance", "Take a few days off to reset"], "a": 0, "e": "The only useful response to a lost deal is to extract the lesson: what you did right, what you did wrong, and what you will not repeat."}], "tp": "You will quote far more trailers than you rent. A customer who walks the lot and leaves is not a failure, it is a rep. Keep a one-line note on every lost deal: what stalled it, and what you will try next time."}, {"n": 2, "id": "j6emy-VHao0", "t": "Don't Spill Your Candy in the Lobby", "d": 78, "q": [{"q": "What does 'spilling your candy in the lobby' mean for a salesperson?", "o": ["Showing up and telling the prospect all about your products before you understand their problems", "Giving discounts before the prospect asks", "Losing your notes before a meeting", "Rushing to the close too early"], "a": 0, "e": "The candy story is about rushing. The salesperson shows up and dumps everything about the product before knowing what the customer cares about."}, {"q": "What does Dave say you should become to uncover what matters to the prospect?", "o": ["A friend who builds rapport first", "An expert who demonstrates product knowledge", "A doctor who asks good questions", "A consultant who gives free advice"], "a": 2, "e": "His prescription is to act like a doctor, ask good questions first, and only then link your product to what they told you."}], "tp": "When someone calls about a 6x12 enclosed, do not start listing sizes, ramps, and payment plans. Ask what they haul, how often, and what they use today. The trailer sells itself once you know the job it has to do."}, {"n": 3, "id": "V_HmffPI3PU", "t": "No Mutual Mystification", "d": 87, "q": [{"q": "What is 'mutual mystification'?", "o": ["Confusing the prospect with technical jargon", "A prospect refusing to share budget information", "Both sides walking away with different assumptions because nobody clarified what was said", "Two salespeople competing for the same account"], "a": 2, "e": "Mutual mystification is when both people leave the conversation with different assumptions because nobody stopped to clarify."}, {"q": "A prospect says 'money is no object.' What does Dave recommend?", "o": ["Say thank you and present the proposal", "Move straight to the premium option", "Stroke, repeat, reverse: thank them, repeat it back, and ask what that means in their world", "Ask for the budget number in writing"], "a": 2, "e": "Stroke, repeat, reverse: thank them for saying it, repeat it back, then ask what it means in their world. It may mean exactly what you think, or not."}], "tp": "'I'll talk to my wife' and 'I'm just comparing' mean different things to different people. Repeat it back and ask what that looks like for them. You will often find the real question is the down payment or delivery, not the spouse."}, {"n": 4, "id": "DJ72NmY-6IE", "t": "A Decision Not to Make a Decision is a Decision", "d": 94, "q": [{"q": "How does Dave rank the three answers a prospect can give you?", "o": ["No is best because it saves time, then yes, then maybe", "Yes is best, 'think it over' is second, no is worst", "Yes is best, no is second best, 'think it over' is the worst", "They are all equal as long as you follow up"], "a": 2, "e": "Yes is best, no is second best, and 'let me think it over' is the worst outcome because it costs you time without a decision."}, {"q": "Who does Dave say is your biggest competitor?", "o": ["The firm down the road", "Online price comparison", "Your own company's slow turnaround", "Prospects who don't give you an answer and kick the can down the road"], "a": 3, "e": "Dave says your real competitor is not the firm down the road. It is prospects who kick the can and never answer."}, {"q": "Why is a funnel full of 'I want to think it over' a problem?", "o": ["It means you need more product training", "It looks good to your manager but wastes your most precious resource: time", "It is not a problem; maybes eventually turn into yeses", "It means your pricing is too high"], "a": 1, "e": "A funnel full of maybes looks healthy to your manager, but time is your most precious resource and maybes burn it."}], "tp": "'Let me think about it' on the lot usually means the customer already decided and does not want to say no to your face. Ask plainly: 'Is this a no, or is something in the way?' A clean no frees you for the next customer."}, {"n": 5, "id": "fWpE50dUJdw", "t": "Never Answer an Unasked Question", "d": 97, "q": [{"q": "In the software example, what mistake did the salesperson make at the end of a great call?", "o": ["Talked badly about a competitor", "Forgot to ask for the order", "Volunteered that a free upgrade was coming in 30 days", "Quoted a price that was too high"], "a": 2, "e": "The rep added a free upgrade in 30 days that nobody asked about. That is the unasked question."}, {"q": "What does Dave say 'throwing stuff on the pile' actually does?", "o": ["Steps on your own foot and makes it harder to close", "Shortens the sales cycle", "Builds trust through transparency", "Makes it easier for the prospect to say yes"], "a": 0, "e": "Piling on extras does not make yes easier. Dave says it steps on your own foot."}], "tp": "When a customer is ready to sign, stop talking. Do not mention next month's special, a bigger model, or a promo that might come. Every extra fact gives them a reason to wait."}, {"n": 6, "id": "wwaTh9YKAJw", "t": "Don't Buy Back Tomorrow the Product or Service You Sold Today", "d": 112, "q": [{"q": "Where does Dave want the buyer's remorse to happen?", "o": ["In front of you, so you can deal with it using your face-to-face skills", "It should be avoided entirely", "In an email so you have a record", "After you leave, so they can process it alone"], "a": 0, "e": "Dave wants the remorse to surface while you are still face to face, so you can use your selling skills on it instead of getting a cancel by email."}, {"q": "What technique does Dave suggest before leaving after a yes?", "o": ["Offer a small bonus to lock in the deal", "Bring back up a minor objection from the sales cycle, like 'you wanted blue, we only have red, is red still OK?'", "Ask for a referral right away", "Confirm the delivery date in writing"], "a": 1, "e": "Reopen a small objection from earlier, like the color example, so any doubt comes out now rather than tomorrow."}], "tp": "Before they drive off, bring back the small thing they hesitated on: 'You wanted the tandem axle and went with the single. Still feel good about that?' Better they voice the doubt to you now than cancel by text tomorrow."}, {"n": 7, "id": "xUCQ4kS0pr8", "t": "You Never Have to Like Prospecting; You Just Have to Do It", "d": 113, "q": [{"q": "What is Dave's first tip for making prospecting something you just do?", "o": ["Reward yourself after every yes", "Only call warm leads", "Look for the no's, not the yeses: if it takes 20 calls to get one appointment, go collect 19 no's", "Have someone else make the first call"], "a": 2, "e": "Flip the goal: if it takes 20 calls to get one appointment, go collect the 19 no's. The no's are the path to the yes."}, {"q": "What is the 'behavioral plan' Dave describes?", "o": ["A plan to hire an appointment setter", "A script for handling objections", "A list of prospects ranked by revenue", "Breaking prospecting into a daily number (10 today, 10 tomorrow) instead of facing 70 at the end of the week"], "a": 3, "e": "A behavioral plan breaks the scary word 'prospecting' into a small daily number you can actually do."}], "tp": "Following up on Facebook Marketplace inquiries and old quotes is prospecting. You do not have to enjoy it. Set a daily number, ten follow-ups, and do it before lunch."}, {"n": 8, "id": "x7a0UQKWM2M", "t": "When Prospecting, Go for the Appointment", "d": 85, "q": [{"q": "What is the time you block for prospecting meant for?", "o": ["Getting appointments and making as many dials as possible", "Sending follow-up emails", "Researching prospects on LinkedIn", "Running full sales calls with whoever picks up"], "a": 0, "e": "Prospecting time is for setting appointments and making dials, not for running sales calls with whoever answers."}, {"q": "A prospect on a cold call says 'tell me a little more.' What does Dave say to do?", "o": ["Transfer them to your manager", "Send them a brochure and call back next week", "Give your full pitch since they are interested", "Cut it short, get the appointment, get off the phone and make the next dial"], "a": 3, "e": "When someone bites, get the appointment and hang up. One 30-minute call that ends in 'send me something' wastes the whole block."}], "tp": "When you are working the follow-up list, the goal is a lot visit, not a full sales pitch by phone. 'When can you come see it, today at 4 or tomorrow morning?' Then move to the next name."}, {"n": 9, "id": "x6FHVSYjBww", "t": "Every Unsuccessful Prospecting Call Earns Compound Interest", "d": 80, "q": [{"q": "What does 'compound interest' mean in this rule?", "o": ["Each unsuccessful call should teach you something so you adjust and get better on every call", "Every call adds to your commission over time", "Prospects you call repeatedly eventually say yes", "Referrals multiply from each call"], "a": 0, "e": "Compound interest means each no makes you a little better, because you reflect and adjust your talk track."}, {"q": "What example of a trend does Dave give?", "o": ["Prospects asking about price first", "Hearing the same competitor mentioned three times", "Gatekeepers asking for your company name", "Voicemails going unanswered on Mondays"], "a": 1, "e": "Dave's example is hearing the same competitor three times. That is a trend you should adjust for."}], "tp": "If three callers this week asked whether we run credit, that is a trend. Put the answer in the first minute of your next calls instead of waiting for the objection."}, {"n": 10, "id": "NrArcgRZn0Q", "t": "Develop a Prospecting Awareness", "d": 102, "q": [{"q": "What is the first thing Dave says you must do?", "o": ["Memorize your 30-second commercial", "Buy a list of leads", "Set a daily call goal", "Clearly identify the characteristics that separate a suspect from a prospect"], "a": 3, "e": "Step one is defining what makes someone a prospect versus a suspect. If you cannot say it quickly, you are probably confusing the two."}, {"q": "Once you have a prospect, what do you figure out next?", "o": ["Whether they are willing and able to buy and have the need, and whether it makes sense to keep talking", "Their personality type", "How to get past the gatekeeper", "Which product to present"], "a": 0, "e": "Once you have a prospect, qualification follows: willing, able, need, and a mutual decision whether to keep talking."}], "tp": "A suspect asks the price of a trailer. A prospect has a job to haul, a rough timeline, and a way to make a weekly or monthly payment. Learn to tell them apart in the first two questions and spend your time on prospects."}, {"n": 11, "id": "shhUPvufApk", "t": "Money Does Grow on Trees", "d": 103, "q": [{"q": "According to Dave, how much more effective is closing a referral compared to a net-new opportunity?", "o": ["Twice as effective", "Ten times more effective", "About the same", "Five times more effective"], "a": 3, "e": "He says closing a referral is five times more effective than closing a net-new opportunity."}, {"q": "How should you treat asking for referrals?", "o": ["As a proactive, ongoing process, not an event", "As something you do once a year with your best clients", "As something you leave to marketing", "As something to do only after a deal closes"], "a": 0, "e": "Referrals are a process you run all the time, not a one-time event."}], "tp": "Every contractor and landscaper who rents from us knows five others who need a trailer. When a customer is happy at pickup, that is the moment to ask who else could use one. Make it part of every delivery."}, {"n": 12, "id": "WYlot8kc3JM", "t": "Answer Every Question with a Question", "d": 98, "q": [{"q": "Before answering a prospect's question, what does Dave want you to know?", "o": ["Whether your competitor gets asked the same thing", "The correct product answer", "The prospect's budget", "The intent: why did they ask, and did I truly understand it"], "a": 3, "e": "Before answering, understand the intent: why did they ask, and did you really understand the question?"}, {"q": "In the 'Dad, what are we doing this weekend?' example, how did Dave respond?", "o": ["He said 'I'm not sure, is there a reason you ask? Would you like to do something?'", "He asked them to check the calendar", "He said 'nothing, why?'", "He listed the weekend plans"], "a": 0, "e": "Dave reversed the question: 'I'm not sure, is there a reason you ask? Would you like to do something?' and the real request came out."}], "tp": "'What's the lowest monthly?' is a question with a hidden reason. Ask 'is there a number you need to stay under?' before you answer. The reason changes which trailer and term you offer."}, {"n": 13, "id": "bCiqippeXg0", "t": "No Mind Reading", "d": 148, "q": [{"q": "A prospect says 'we're working with one of your competitors.' What does Dave recommend?", "o": ["Ask to speak with the decision maker", "Offer a lower price to switch", "Say 'I appreciate the transparency, help me understand why you brought that up'", "Explain why you are better than that competitor"], "a": 2, "e": "Instead of defending, Dave says 'I appreciate the transparency, help me understand why you brought that up.' That peels back the onion."}, {"q": "Which phrases does Dave say to use instead of assuming?", "o": ["'Our competitors say that too'", "'Let me tell you how we handle that'", "'Help me understand what that means' and 'I'm a little confused when you said X, you must be telling me that for a reason'", "'Trust me, I've seen this before'"], "a": 2, "e": "'Help me understand' and 'you must be telling me that for a reason' are his go-to lines because they avoid assuming."}], "tp": "When a customer says they found the same trailer cheaper on Marketplace, do not start defending our price. Ask what they liked about that one. Often it has no title, no warranty, or no payment option, and they tell you themselves."}, {"n": 14, "id": "N47LVqd3Pgg", "t": "A Prospect Who Is Listening Is No Prospect at All", "d": 104, "q": [{"q": "What talking ratio does Dave say Sandler always recommended?", "o": ["Salesperson 70%, prospect 30%", "Salesperson 90%, prospect 10%", "Prospect 70%, salesperson 30%", "50/50"], "a": 2, "e": "Sandler's ratio is the prospect talking 70 percent of the time and you 30 percent."}, {"q": "If you are talking 90% of the call, what is happening?", "o": ["You are controlling the sale", "The prospect is not engaging and you don't learn what their issues are", "You are building credibility", "The prospect is absorbing your product knowledge"], "a": 1, "e": "If you talk 90 percent of the call, the prospect is not engaging and you learn nothing about their issues."}], "tp": "On a lot walk, the customer should be talking about their work, their truck, and what broke on their last trailer. If you are the one talking, you are guessing at what they need."}, {"n": 15, "id": "jGSEgeimoi8", "t": "The Best Sales Presentation You Will Ever Give, The Prospect Will Never See", "d": 107, "q": [{"q": "Where does Dave say your value as a salesperson comes from?", "o": ["The questions you ask and the information you gather", "Your years of experience", "Your product certifications", "The information you dispense"], "a": 0, "e": "Your value is the questions you ask and the information you gather, not the information you dispense."}, {"q": "How does Dave use a third-party story to open a conversation?", "o": ["'When I talk to people like you, the top two issues I hear are X and Y. Does that sound familiar?'", "'Most people in your position buy the premium package'", "'Let me show you what we did for a competitor'", "'Our biggest client saw a 40% improvement'"], "a": 0, "e": "The third-party opener, 'the top two issues I hear from people like you are X and Y, does that sound familiar?', lets prospects close themselves."}], "tp": "Instead of a tour of every trailer, open with: 'Most people who come in for a cargo trailer are dealing with one of two things, gear getting stolen out of an open bed or a rental that costs more than a payment. Which one is you?'"}, {"n": 16, "id": "u07WTnGOALw", "t": "Never Ask for the Order - Make the Prospect Give Up", "d": 111, "q": [{"q": "Why does Dave say not to push for the close with 'is now the time?'", "o": ["When you push, people resist; you want to pull instead", "It should only be done by managers", "It sounds unprofessional", "It gives the prospect a chance to say no"], "a": 0, "e": "Asking 'is now the time?' is pushing, and people resist being pushed. Dave wants you to pull."}, {"q": "Which question does Dave call a 'magical' pull question?", "o": ["'What would you like me to do now?'", "'Can we sign today?'", "'Is there any reason not to move forward?'", "'What would it take to earn your business?'"], "a": 0, "e": "'What would you like me to do now?' is the magical question because the prospect states the next step."}, {"q": "What does Dave think of 'ABC: Always Be Closing'?", "o": ["It works for transactional sales only", "It is the foundation of Sandler", "It is pushing, and pushing is what an amateur does", "It is fine as long as you smile"], "a": 2, "e": "Always Be Closing is pushing, and Dave calls that the amateur move."}], "tp": "Do not ask 'you ready to sign?' Ask 'what would you like to do from here?' or 'what do you see as the next step?' When they say 'let's do the paperwork,' the decision is theirs and it sticks."}, {"n": 17, "id": "ppANRxlJcqo", "t": "The Professional Does What They Did as a Dummy - on Purpose", "d": 109, "q": [{"q": "What happens after years in the industry and 'product school'?", "o": ["You start spewing acronyms and product knowledge your buyers don't understand", "You need fewer questions", "You close more because you know more", "You become a trusted advisor automatically"], "a": 0, "e": "After years of product school, reps start spewing acronyms that buyers do not understand."}, {"q": "Where does Dave say to keep your product knowledge?", "o": ["In the proposal", "Front and center to establish credibility", "In a leave-behind brochure", "In your back pocket, because it is not what establishes credibility"], "a": 3, "e": "Product knowledge belongs in your back pocket. It is not what builds credibility."}], "tp": "Even after you know every spec on the lot, keep asking rookie questions: 'What are you going to haul in it?' The specs go in your back pocket until they matter to that customer."}, {"n": 18, "id": "ZkrJy0KVt9o", "t": "Don't Paint \"Seagulls\" in Your Prospect's Picture", "d": 113, "q": [{"q": "What is a 'seagull' in this rule?", "o": ["An objection you did not expect", "A distraction during a sales call", "A feature or benefit you add to the conversation that the prospect never said was important", "A competitor who swoops in late"], "a": 2, "e": "A seagull is a feature or benefit you drop into the conversation that the prospect never said mattered."}, {"q": "The prospect has four problems, you solve all four, then add ten more things your product does. What is the risk?", "o": ["They want to see all ten features demonstrated", "They ask for a bigger discount", "They feel they are paying for things they don't need and start thinking about things that were not even relevant", "There is no risk; more value always helps"], "a": 2, "e": "Extra features make buyers wonder what they are paying for and open doubts that were not there. Dave calls it Pandora's box."}], "tp": "A customer who needs a trailer to haul mowers does not need to hear about the electric brakes package, the spare tire mount, and the LED upgrade. Solve the mower problem. Extras make them feel they are paying for things they did not ask for."}, {"n": 19, "id": "Vy6nJ1l7oSM", "t": "Never Help the Prospect End the Interview", "d": 101, "q": [{"q": "What rule of thumb does Dave give for this situation?", "o": ["If in doubt, get out", "Never interrupt a prospect", "If you feel it, say it", "Silence is golden"], "a": 2, "e": "Dave's rule of thumb: if you feel it, say it."}, {"q": "What does Dave suggest saying?", "o": ["'I get the feeling I may have said something that took us offline or upset you, and I apologize. Help me understand.'", "'Let me skip to the good part'", "'Is there a problem with our pricing?'", "'I can see you're busy, should I come back later?'"], "a": 0, "e": "His line is to name the feeling, apologize if you caused it, and ask them to help you understand."}], "tp": "If the customer goes quiet or checks their phone mid-walk, do not wrap up early. Say: 'I get the feeling something I said didn't sit right. Help me understand.' Usually it is the payment, and now you can talk about it."}, {"n": 20, "id": "URDfbxfKR6I", "t": "The Bottom Line of Professional Selling Is Going to the Bank", "d": 140, "q": [{"q": "What is the 'cookbook' Dave describes?", "o": ["Your company's pricing guide", "A list of objection responses", "A collection of third-party stories", "What you have to do, when, and how often, because you can only control your behavior, not the outcome"], "a": 3, "e": "The cookbook is the list of behaviors you control every day, because you control behavior, not outcomes."}, {"q": "Why is Dave a believer in talk tracks?", "o": ["They make sure every rep says the same thing", "They make you sound polished", "They shorten training time", "If you know your talk track you can focus on the buyer instead of thinking about what to say next"], "a": 3, "e": "Knowing your talk track frees your attention for the buyer instead of hunting for your next line."}], "tp": "Track your own numbers: calls to lot visits, lot visits to applications, applications to rentals. The weakest ratio is where to work. Know your opening lines cold so your attention is on the customer."}, {"n": 21, "id": "S1yhVQFhv-A", "t": "Sell Today - Educate Tomorrow", "d": 103, "q": [{"q": "What is the one simple thing you have to do to sell?", "o": ["Get the decision maker in the room", "Beat the competitor's price", "Demonstrate every feature", "Connect the prospect's pain to what you can solve"], "a": 3, "e": "The one job is to connect the prospect's pain to what you solve."}, {"q": "When should the buyer learn about all the other cool things the product does?", "o": ["Never; it is irrelevant", "In the proposal appendix", "In the first meeting, to build excitement", "After they have purchased, otherwise you overwhelm and paralyze them into indecision"], "a": 3, "e": "All the other cool features can be taught after the purchase. Before it, they overwhelm and cause indecision."}], "tp": "Get them into the right trailer on the right payment today. The care tips, tie-down tricks, and add-on options can all come at delivery or in a follow-up text."}, {"n": 22, "id": "A63Pe91VBXI", "t": "Only Give a Presentation for the \"Kill\"", "d": 109, "q": [{"q": "What is 'premature presentation syndrome'?", "o": ["Presenting before the decision maker arrives", "Presenting early in the process to educate the buyer, which prevents you from closing more business", "Rushing through your slides", "Presenting without slides"], "a": 1, "e": "Premature presentation syndrome is presenting early to educate, which actually prevents closing."}, {"q": "What should you do before you present?", "o": ["Stay in the information-gathering phase as long as possible and connect the buyer's pains to what you will present", "Rehearse your close", "Confirm the budget in writing", "Send an agenda"], "a": 0, "e": "Stay in information gathering as long as possible and tie the presentation to the pains you uncovered."}], "tp": "Do not start presenting trailers the second they arrive. Ask questions until you know what they haul, how far, how often, and what payment works. Then show the one or two trailers that fit."}, {"n": 23, "id": "sLJGkeWfQVo", "t": "The Way to Get Rid of a Bomb Is to Defuse It Before It Blows Up", "d": 119, "q": [{"q": "When does Dave say to put an issue on the table early?", "o": ["Only after the proposal is accepted", "When it comes up more than 80% of the time", "Never; let the prospect discover it", "Only when the prospect brings it up"], "a": 1, "e": "Dave's threshold is any issue that comes up more than 80 percent of the time. Raise it yourself."}, {"q": "Why bring up the problem early?", "o": ["It lowers the prospect's expectations", "It gives you more credibility and it is easier to fix a problem before it is a problem; you can't lose anything you don't have", "It lets you skip the presentation", "It forces a faster decision"], "a": 1, "e": "Raising it early builds credibility, and you cannot lose a deal you do not have yet."}], "tp": "If most customers flinch at the deposit or the weekly payment, bring it up early yourself: 'Before we walk the lot, most folks want to know how the payments work, so here it is.' An early answer is a conversation. A late one is a bomb."}, {"n": 24, "id": "Y3wB3mkGPLg", "t": "Product Knowledge Used at the Wrong Time Can Be Intimidating", "d": 177, "q": [{"q": "What does a buyer who does not understand your jargon usually say?", "o": ["'I don't understand, can you explain?'", "'How much does that cost?'", "'Let me get my technical person'", "'That's a great approach, could you put it in writing and send it to my office?'"], "a": 3, "e": "A confused buyer does not say 'I don't understand.' They say 'send me something in writing' and get rid of you."}, {"q": "What is the goal Dave wants you to keep in mind with buyers?", "o": ["Prove you are the expert", "Maintain their 'okayness' and self-esteem, because uncomfortable people get rid of you", "Speed up the decision", "Get them to ask more questions"], "a": 1, "e": "The goal is to keep the buyer feeling okay. Uncomfortable people get rid of salespeople."}], "tp": "GVWR, tongue weight, and axle ratings mean nothing to most customers. Say 'this one will carry your two mowers and a trimmer rack with room to spare.' If they nod politely and ask you to text them the info, you lost them."}, {"n": 25, "id": "RkdGIctQ6UY", "t": "When You Want to Know the Future, Bring It Back to the Present", "d": 125, "q": [{"q": "Before doing something that takes time and energy, what does Dave say to ask?", "o": ["'Will you sign if I do this?'", "'Who else should see this?'", "'Happy to do it. Let's pretend I do all of that and show you. What happens next?'", "'How soon do you need it?'"], "a": 2, "e": "Before doing the work, ask: 'Let's pretend I do all that. What happens next?'"}, {"q": "If the answer to 'what happens next' is 'we'll think about it when we decide in five years', what should you conclude?", "o": ["Offer a discount to speed them up", "Ask for a referral instead", "That may not be acceptable; don't let buyers consume your time when it is not progressing the sale", "That is normal; keep going"], "a": 2, "e": "If the answer to 'what happens next' is a five-year maybe, the work is not progressing the sale and may not be worth it."}], "tp": "When a customer asks you to hold a trailer, send more photos, or price three configurations, ask first: 'Happy to. If I do that, what happens next?' If the answer is 'I'll think about it,' you know where you stand before you spend the hour."}, {"n": 26, "id": "k0xQmsd1vL8", "t": "People Buy In Spite of the Hard Sell, Not Because of It", "d": 86, "q": [{"q": "Complete Dave's line: 'People love to buy, but they hate...'", "o": ["...to wait", "...to be sold", "...to pay", "...to decide"], "a": 1, "e": "People love to buy but hate to be sold."}, {"q": "What does Dave say to do instead of pushing?", "o": ["Send a follow-up email", "Create an environment where people feel comfortable sharing, and pull them through the process with questions", "Use a softer closing line", "Wait for them to call you"], "a": 1, "e": "Create an environment where they feel comfortable sharing and pull them through with questions."}], "tp": "Nobody wants to be pushed into a trailer payment. 'Sign today and I'll throw in the spare' gets resistance. Questions get trust. People who rent from us because they wanted to are the ones who keep paying."}, {"n": 27, "id": "3sikQ2jS1MU", "t": "You Can't Sell Anybody Anything - They Must Discover They Want It", "d": 89, "q": [{"q": "What does Dave say about the person who can 'sell ice to Eskimos'?", "o": ["That is the goal", "It only works with a great script", "It works for small purchases only", "If the buyer does not think they have a problem, you can't sell them regardless of product or discount"], "a": 3, "e": "If the buyer does not believe they have a problem, no product or discount will sell them."}, {"q": "How does Dave suggest helping prospects discover they have an issue?", "o": ["Be a doctor: ask questions, and use your 30-second commercial and third-party stories", "Show them competitor case studies", "Offer a free trial", "Send them industry statistics"], "a": 0, "e": "Be a doctor: questions, a 30-second commercial, and third-party stories help them discover the issue."}], "tp": "A customer who thinks their open bed is fine will not rent an enclosed no matter the deal. Ask about tools going missing or gear getting rained on. If they discover the problem, they want the fix."}, {"n": 28, "id": "A-1E82zwq_I", "t": "When Under Attack - Fall Back", "d": 88, "q": [{"q": "What is the natural human reaction when attacked, and why is it a problem?", "o": ["To defend and justify, which makes the other person defend too and the argument escalates", "To apologize too much, which loses credibility", "To go silent, which looks weak", "To walk away, which ends the sale"], "a": 0, "e": "The natural reaction is to defend, which makes the other person defend, and it escalates."}, {"q": "What does 'fall back' mean in practice?", "o": ["Offer a discount to calm them down", "Let your manager handle it", "Change the subject", "Take ownership regardless of whose fault it is: 'you're right, that was my bad, I'll do better'"], "a": 3, "e": "Fall back means take ownership regardless of fault. It takes the steam out of the attack."}], "tp": "When a customer is upset about a late delivery or a payment mix-up, do not explain why it was not your fault. 'You're right, that's on us, here is what I'll do' ends the fight. Then fix it."}, {"n": 29, "id": "0NIi4jWi38U", "t": "Your Meter's Always Running", "d": 63, "q": [{"q": "What does 'your meter is always running' mean?", "o": ["Always be prospecting", "Track every hour you spend on an account", "No matter how long you have known the customer or how relaxed the setting, you still represent the company", "Bill for every service call"], "a": 2, "e": "No matter how long you have known someone or how relaxed the setting, you still represent the company."}, {"q": "How does Dave say to think about long-time customers?", "o": ["As partners", "As friends first, buyers second", "As buyers first, maybe work friends second", "As referral sources"], "a": 2, "e": "Buyers first, work friends second."}], "tp": "Long-time customers become friendly, and that is good. But when they are behind on a payment or want a favor on a second trailer, you still represent the business. Customer first, friend second."}, {"n": 30, "id": "0bLQUjcC7Bg", "t": "You Can't Lose Anything You Don't Have", "d": 74, "q": [{"q": "What does Dave say about the 'coulda, shoulda, woulda' mindset?", "o": ["It is not true; you can't lose something you never had", "It helps you learn", "It is a sign of a good salesperson", "It is healthy in small doses"], "a": 0, "e": "The coulda-shoulda-woulda mindset is false. You cannot lose something you never had."}, {"q": "When does a salesperson become a 'hostage'?", "o": ["When the prospect is a big company", "When the funnel is thin, you're losing more than winning, or you're on the edge of a bonus, so you get hesitant and follow the prospect's process", "When the manager listens to calls", "When the competitor is cheaper"], "a": 1, "e": "A thin funnel, a losing streak, or a bonus on the line makes you a hostage who follows the prospect's process."}], "tp": "If it is a slow week, you will be tempted to chase a shaky customer, drop the deposit, or skip a step in the application. Do not. Run the same process every time. You cannot lose a rental you never had."}, {"n": 31, "id": "WISs2eJQLpM", "t": "Close the Sale or Close the File", "d": 95, "q": [{"q": "How does Dave re-energize a stalled deal?", "o": ["Ask for a meeting with their boss", "Say 'based on where we are, it seems there's not a fit, maybe we should close this for now and come back at a future time'", "Offer a limited-time discount", "Send a breakup email"], "a": 1, "e": "Dave re-energizes stalled deals by saying it seems there is not a fit and offering to close the file."}, {"q": "What are the two possible outcomes, and why does Dave say you win either way?", "o": ["They buy or they refer you", "They ask for a discount or they go silent", "They agree it's over (it was over anyway) or they say 'wait, here's what we need to do next'", "They get angry or they apologize"], "a": 2, "e": "Either they agree, and it was over anyway, or they tell you the real next step. You win both ways."}], "tp": "Quotes that have been sitting two weeks are not a pipeline, they are a to-do list that makes you feel busy. Text them: 'Sounds like the timing isn't right, I'll close this out for now.' They either agree or tell you what they need."}, {"n": 32, "id": "5fXSzvSgHjo", "t": "Get an IOU for Everything You Do", "d": 89, "q": [{"q": "What is the problem with answering every customer request with 'no problem'?", "o": ["It makes you seem desperate", "The customer never acknowledges the favor because it happened too quickly", "It sounds unprofessional", "It commits you to things you can't do"], "a": 1, "e": "'No problem' happens so fast the customer never registers the favor."}, {"q": "What does Dave suggest saying when a customer asks to move the delivery date?", "o": ["'I'm not sure, that may be an issue. How important is this? Let me check and call you back'", "'That will cost extra'", "'Sure, done'", "'Let me ask my manager'"], "a": 0, "e": "Slow it down: 'I'm not sure, that may be an issue. How important is this?' Then call back with the win."}], "tp": "When a customer asks to move a pickup date or a payment date, do not say 'no problem.' Say 'let me check, how important is this for you?' Then call back with the yes. They remember the favor, and that keeps them from shopping elsewhere."}, {"n": 33, "id": "zMm6nAm-144", "t": "On Your Way to the Bank, Keep One Eye Over Your Shoulder", "d": 68, "q": [{"q": "When you hear a yes, what does it mean, according to Dave?", "o": ["You can stop selling", "Time to ask for referrals", "It just means they said yes; a lot can still happen before you get the check", "The deal is done"], "a": 2, "e": "A yes only means they said yes. Plenty can happen before the check arrives."}, {"q": "What does Dave tell you to do about the gap between yes and the check?", "o": ["Get the contract signed on the spot", "Send the invoice faster", "Identify everything that could pop up in that gap and take care of each one", "Call the prospect daily"], "a": 2, "e": "Identify everything that can go wrong between yes and payment and handle each one."}], "tp": "A verbal yes on the lot is not a rental. Between yes and pickup they need the deposit, the paperwork, the insurance, and a hitch that fits. Walk each step with them before you count it."}, {"n": 34, "id": "Jf__VIpotjI", "t": "Work Smart, Not Hard", "d": 79, "q": [{"q": "What does Dave say about his old belief 'I'm not smarter than you, but I'll outwork you'?", "o": ["It works for young salespeople", "It is the secret to his success", "It only works in the Northeast", "It is not a badge of courage; it tends to waste a lot of time"], "a": 3, "e": "Dave says outworking everyone is not a badge of courage. It wastes time."}, {"q": "What does working smart look like?", "o": ["Only calling on big accounts", "Having a process and methodology, knowing where you are and what comes next, and leading the buyer-seller dance", "Working fewer hours", "Delegating prospecting"], "a": 1, "e": "Working smart is having a process, knowing where you are and what comes next, and leading the buyer-seller dance."}], "tp": "Working hard is walking every customer through every trailer. Working smart is qualifying in two minutes and showing the two trailers that fit. Lead the visit, do not follow it."}, {"n": 35, "id": "0xm570w-rfE", "t": "If Your Competition Does It, Stop Doing It Right Away", "d": 105, "q": [{"q": "Why can't prospects tell you apart from your competitors?", "o": ["Because you sell the same product", "Because they don't do research", "Because you say the same things (quality, service, reputation, ROI), act the same and look the same", "Because your prices are similar"], "a": 2, "e": "Everyone says quality, service, reputation, and ROI, so prospects cannot tell you apart."}, {"q": "If you want to be treated differently, what do you have to do?", "o": ["Advertise more", "Act differently; the different thing becomes what the prospect focuses on and a conversation starter", "Offer more features", "Lower your price"], "a": 1, "e": "To be treated differently you must act differently. The different thing becomes the conversation."}], "tp": "Every trailer dealer says quality, service, and best prices. If we say the same thing we compete on price. Say what is different: no credit check, weekly payments, you can own it, and we deliver. Make that the first thing they hear."}, {"n": 36, "id": "roY6Ol1x390", "t": "Only Decision Makers Can Get Others to Make Decisions", "d": 83, "q": [{"q": "What does Dave say is your greatest competitor?", "o": ["Price", "Indecision: deals that are stagnant and not going anywhere", "Your own product gaps", "The company down the road"], "a": 1, "e": "Dave's greatest competitor is indecision, deals that sit and go nowhere."}, {"q": "What thought does Dave warn you not to have?", "o": ["'I need a bigger discount'", "'That makes sense, I wouldn't make this decision either'", "'I should have presented sooner'", "'They will never buy'"], "a": 1, "e": "The dangerous thought is 'I wouldn't decide either,' because then you accept think-it-over."}], "tp": "If you are slow to decide things yourself, you will accept 'let me think about it' too easily. Be decisive on the lot: recommend the trailer, name the payment, and ask for a decision."}, {"n": 37, "id": "-tjPvbHiHRs", "t": "All Prospects Lie, All the Time", "d": 99, "q": [{"q": "How does Dave soften the rule?", "o": ["'All prospects are protecting themselves all the time', and some don't even know the real issue", "'Prospects lie until they trust you'", "'Prospects only lie about budget'", "'Some prospects lie sometimes'"], "a": 0, "e": "Dave softens it to: all prospects protect themselves all the time, and some do not know the real issue."}, {"q": "What mindset does Dave recommend going into a call?", "o": ["Trust everything they say", "'I heard what they said, but I'm not sure it's accurate', then keep going through your process", "Assume they are hiding the budget", "Verify everything with their boss"], "a": 1, "e": "Go in thinking 'I heard it, but I'm not sure it's accurate,' and keep running your process."}], "tp": "'Just looking' is the first thing almost every walk-in says. It is protection, not truth. Smile, say 'no problem,' and ask what brought them in. The real reason comes out in a minute."}, {"n": 38, "id": "4A9eWO4S5-A", "t": "The Problem the Prospect Brings You Is Never The Real Problem", "d": 88, "q": [{"q": "In the example, a prospect asks for presentation skills training because they close 2 out of 10. What was the real problem?", "o": ["Their pricing", "Their slides", "Their closing technique", "Their qualification stage: they were presenting to people who were unwilling or unable"], "a": 3, "e": "The stated problem was presentation skills, but the real problem was presenting to unqualified people."}, {"q": "What does Dave say your job is?", "o": ["Be a doctor of sales and figure out what is causing what they think is the problem", "Refer them to a specialist", "Sell them the product they asked for", "Solve the problem they bring you as fast as possible"], "a": 0, "e": "Your job is to be the doctor of sales and find the cause behind what they think is the problem."}], "tp": "A customer says they need a bigger trailer. Ask why. Often the real problem is loading, tie-downs, or weight distribution, and the right answer is a different trailer or a ramp, not a bigger payment."}, {"n": 39, "id": "HT7YuSPpK-k", "t": "When All Else Fails, Become a Consultant", "d": 110, "q": [{"q": "What go-to move does Dave reject when a deal is lost?", "o": ["Lowering the price, because it destroys the credibility of everything you said before", "Asking for a referral", "Asking for feed const TRAINER_EMAIL = "jacobo@aigroups.com";
const BASE = "sandler-rules-quiz-v3";
const TOTAL = RULES.reduce((a,r)=>a+r.q.length,0);
const L = ["A","B","C","D"];

function fresh(name){ return {name:name||"",answers:{},cur:0,started:null,finished:null,view:"intro"}; }
function keyFor(name){ return BASE+":"+String(name||"").trim().toLowerCase().replace(/\s+/g," "); }
function qcount(n){ return RULES.find(r=>r.n===n).q.length; }
function answered(n, A){ A = A || S.answers; let c=0; for(let i=0;i<qcount(n);i++) if(A[n+"-"+i]!=null) c++; return c; }
function complete(A){ return RULES.every(r=>answered(r.n, A)===r.q.length); }
function countAnswered(A){ A = A || S.answers; return Object.keys(A).length; }
function normalize(s, name){
  const f = fresh(name);
  if(!s || typeof s!=="object") return f;
  if(s.answers && typeof s.answers==="object"){ for(const r of RULES) for(let i=0;i<r.q.length;i++){ const v=s.answers[r.n+"-"+i]; if(Number.isInteger(v) && v>=0 && v<r.q[i].o.length) f.answers[r.n+"-"+i]=v; } }
  f.cur = Number.isInteger(s.cur) ? Math.min(Math.max(s.cur,0),RULES.length-1) : 0;
  f.started = typeof s.started==="string" ? s.started : null;
  f.finished = typeof s.finished==="string" ? s.finished : null;
  f.view = (s.view==="rule" || s.view==="results") ? s.view : "rule";
  if(f.view==="results" && !complete(f.answers)) f.view="rule";
  return f;
}
function loadFor(name){ try{ return normalize(JSON.parse(localStorage.getItem(keyFor(name))||"null"), name); }catch(e){ return fresh(name); } }
function listNames(){ try{ const a=JSON.parse(localStorage.getItem(BASE+":names")||"[]"); return Array.isArray(a)? a.filter(x=>typeof x==="string") : []; }catch(e){ return []; } }
function save(){
  try{
    localStorage.setItem(keyFor(S.name), JSON.stringify(S));
    const names = listNames(); if(!names.some(n=>keyFor(n)===keyFor(S.name))){ names.push(S.name); localStorage.setItem(BASE+":names", JSON.stringify(names)); }
  }catch(e){}
}
function storageOK(){ try{ localStorage.setItem(BASE+":t","1"); localStorage.removeItem(BASE+":t"); return true; }catch(e){ return false; } }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

let S = fresh("");
const app = document.getElementById("app");
const bar = document.getElementById("bar");

function render(keepScroll){
  const y = window.scrollY;
  if(S.view==="intro") renderIntro();
  else if(S.view==="results") renderResults();
  else renderRule(S.cur);
  window.scrollTo({top: keepScroll ? y : 0});
}

function renderIntro(){
  bar.hidden = true;
  const names = listNames();
  app.innerHTML = `
  <div class="card hero">
    <div class="eyebrow">Sales training</div>
    <h1 style="margin-top:10px">Sandler Rules Quiz</h1>
    <p style="margin-top:14px">100 questions across the 49 Sandler Rules you watched, two per rule and three on a couple of the big ones. Your first answer on each question is the one that counts.</p>
    <ol class="steps">
      <li><span>Type your name and start.</span></li>
      <li><span>Pick an answer. You will see right away whether it was correct, with a short explanation of the right answer.</span></li>
      <li><span>After each rule you get a note on how it applies on the trailer lot.</span></li>
      <li><span>Your progress saves on this device under your name, so you can stop and come back. Other people can take the quiz on the same device without mixing results.</span></li>
      <li><span>After rule 49 you will see your score and a button that emails your results to Jacobo.</span></li>
    </ol>
    <div class="field">
      <label for="name">Your name</label>

    ${names.length ? `<div class="saved"><h3>Saved on this device</h3><div class="row">${names.map(n=>{ const st=loadFor(n); const c=countAnswered(st.answers); return `<button data-name="${esc(n)}">${esc(n)}<small>${st.finished ? "finished" : c+" / "+TOTAL}</small></button>`; }).join("")}</div><div class="hint">Tap your name to continue where you left off.</div></div>` : ""}
  </div>`;
  const nameEl = document.getElementById("name");
  const go = (nm) => { nm = nm.trim().slice(0,60); if(!nm){ nameEl.focus(); nameEl.style.outline="2px solid var(--accent)"; return; }
    S = loadFor(nm); S.name = nm; if(!S.started) S.started = new Date().toISOString(); if(S.view==="intro") S.view="rule"; save(); render(); };
  document.getElementById("start").onclick = () => go(nameEl.value);

function renderRule(i){
  const r = RULES[i];
  bar.hidden = false;
  document.getElementById("barRule").textContent = `Rule ${r.n} of ${RULES.length}`;
  document.getElementById("barName").textContent = "- " + S.name;
  document.getElementById("barCount").textContent = `${countAnswered()} / ${TOTAL} answered`;
  document.getElementById("barFill").style.width = (100*countAnswered()/TOTAL)+"%";

  const qs = r.q.map((q,qi)=>{
    const p = S.answers[r.n+"-"+qi]; const done = p!=null; const right = done && p===q.a;
    return `
    <div class="q ${done?"done":""}">
      <h3><span>Q${qi+1}</span>${esc(q.q)}</h3>
      <div class="opts" role="radiogroup" aria-label="Question ${qi+1}">
        ${q.o.map((o,oi)=>`
        <label class="opt ${done&&oi===q.a?"correct":""} ${done&&oi===p&&!right?"picked":""}">
          <input type="radio" name="q${r.n}_${qi}" id="q${r.n}_${qi}_${oi}" value="${oi}" ${p===oi?"checked":""} ${done?"disabled":""}>
          <span class="l">${L[oi]}</span><span>${esc(o)}</span>
        </label>`).join("")}
      </div>
      ${done ? `<div class="fb ${right?"ok":"bad"}"><b>${right ? "Correct." : "Not quite. The correct answer is " + L[q.a] + "."}</b> ${esc(q.e)}</div>` : ""}
    </div>`;
  }).join("");

  const allDone = answered(r.n)===r.q.length;
  const last = i===RULES.length-1;
  app.innerHTML = `
  <div class="card">
    <div class="eyebrow">Sandler Rule</div>
    <div class="rulenum">${r.n}</div>
    <h2 class="ruletitle">${esc(r.t)}</h2>
    ${qs}
    ${allDone ? `<div class="tp"><div class="eyebrow">On the trailer lot</div><p>${esc(r.tp)}</p></div>` : ""}
    <div class="nav">
      <button class="btn" id="prev" ${i===0?"disabled":""}>Previous</button>
      <button class="btn primary" id="next" ${allDone?"":"disabled"}>${last ? "Finish and see my score" : "Next rule"}</button>
    </div>
    <div class="hint" id="nextHint">${allDone ? "" : "Answer every question to continue."}</div>
    <details class="jump">
      <summary>Jump to a rule</summary>
      <div class="grid" id="grid"></div>
    </details>
  </div>`;

  app.querySelectorAll("input[type=radio]:not([disabled])").forEach(inp => {
    inp.addEventListener("change", () => {
      const [ , n, qi ] = inp.name.match(/q(\d+)_(\d+)/);
      if(S.answers[n+"-"+qi]!=null) return;
      S.answers[n+"-"+qi] = Number(inp.value); save();
      render(true);
    });
  });
  document.getElementById("prev").onclick = () => { S.cur = i-1; save(); render(); };
  document.getElementById("next").onclick = () => {
    if(last){
      if(!complete()){
        const missing = RULES.filter(x=>answered(x.n)<x.q.length).map(x=>x.n);
        document.getElementById("nextHint").textContent = "Some rules are not finished yet: " + missing.join(", ") + ". Use the 'Jump to a rule' list below.";
        return;
      }
      if(!S.finished) S.finished = new Date().toISOString(); S.view="results"; save(); render();
    } else { S.cur = i+1; save(); render(); }
  };
  paintGrid();
}
function paintGrid(){
  const g = document.getElementById("grid"); if(!g) return;
  g.innerHTML = RULES.map((x,idx)=>{ const a=answered(x.n); const cls = a===x.q.length?"done":a>0?"part":""; return `<button class="${cls} ${idx===S.cur?"cur":""}" data-i="${idx}" title="Rule ${x.n}: ${esc(x.t)}">${x.n}</button>`; }).join("");
  g.querySelectorAll("button").forEach(b=>b.onclick=()=>{ S.cur=Number(b.dataset.i); save(); render(); });
}

function grade(){
  let score=0; const per=[]; const missed=[];
  RULES.forEach(r=>{ let s=0; r.q.forEach((q,qi)=>{ const p=S.answers[r.n+"-"+qi]; if(p===q.a) s++; else missed.push(`R${r.n} Q${qi+1} = ${p==null?"-":L[p]} (correct ${L[q.a]})`); }); per.push(s); score+=s; });
  return {score,per,missed};
}
function reportText(g){
  const pct = Math.round(100*g.score/TOTAL);
  const when = new Date(S.finished||Date.now());
  const perfect = RULES.filter((r,i)=>g.per[i]===r.q.length).map(r=>r.n);
  return [
    "Sandler Rules Quiz - results",
    `Name: ${S.name}`,
    `Score: ${g.score} / ${TOTAL} (${pct}%)`,
    `Completed: ${when.toLocaleString()}`,
    "",
    `Missed questions (${g.missed.length}):`,
    ...(g.missed.length? g.missed : ["none"]),
    "",
    `Per-rule scores (rule:correct/questions):`,
    RULES.map((r,i)=>`${r.n}:${g.per[i]}/${r.q.length}`).join("  "),
    "",
    `Perfect rules: ${perfect.length? perfect.join(", ") : "none"}`
  ].join("\n");
}

        <a class="btn primary" id="gmailBtn" href="${gmail}" target="_blank" rel="noopener" style="text-decoration:none;display:inline-block">Open in Gmail</a>
        <a class="btn" id="mailBtn" href="${mailto}" style="text-decoration:none;display:inline-block">Use another mail app</a>
        <button class="btn" id="copyBtn">Copy results text</button>
      </div>
      <div class="toast" id="toast"></div>
      <details style="margin-top:8px"><summary style="font-size:14px;color:var(--muted);cursor:pointer">If neither button works, copy this text and paste it into an email or text message to Jacobo</summary>
        <textarea id="txt" readonly>${esc(text)}</textarea>
      </details>
    </div>
    <div class="nav">
      <button class="btn" id="review">Review the rules</button>
      <button class="btn" id="reset">Done. Let someone else take it</button>
    </div>
  </div>`;
  app.querySelectorAll(".rgrid div").forEach(d => d.onclick = () => { S.cur = Number(d.dataset.i); S.view="rule"; save(); render(); });
  document.getElementById("copyBtn").onclick = async () => {
    const t = document.getElementById("toast");
    try{ await navigator.clipboard.writeText(text); t.textContent="Copied. Paste it into an email or text to Jacobo."; }
    catch(e){ const ta=document.getElementById("txt"); ta.closest("details").open=true; ta.focus(); ta.select(); t.textContent="Text selected below. Press Ctrl+C or Cmd+C to copy."; }
  };
  document.getElementById("review").onclick = () => { S.view="rule"; S.cur=0; save(); render(); };
  document.getElementById("reset").onclick = () => { S = fresh(""); render(); };
}
render();
</script>
</body>
</html>
